name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  configuration:
    name: Configuration et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aucun secret dans le dépôt
        run: |
          git ls-files --error-unmatch .env 2>/dev/null && { echo "::error::.env est versionné"; exit 1; }
          # Les mots de passe du modèle doivent rester vides
          if grep -E '^[A-Z_]*PASSWORD=.+' .env.example; then
            echo "::error::.env.example contient un mot de passe"; exit 1
          fi

      - name: Tableau de bord à jour par rapport à son générateur
        run: |
          python3 Dashboards/build.py
          git diff --exit-code Dashboards/soc.ndjson

      - name: Configuration, JSON, scripts et tests du pipeline Vector
        run: ./scripts/verify.sh --static

  bout-en-bout:
    name: Démarrage complet et attaques simulées
    runs-on: ubuntu-latest
    needs: configuration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prérequis OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Démarrage du SOC
        run: ./soc demarrer

      - name: Vérification complète (sécurité, détection, alertes)
        run: ./soc verifier

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail 80
