data_dir: "/var/lib/vector"

# Fuseau des horodatages sans fuseau (syslog RFC 3164 envoie l'heure locale)
timezone: "${SOC_TIMEZONE:-Europe/Paris}"

# API Vector : santé du pipeline (/health) et `vector top`
api:
  enabled: true
  address: "0.0.0.0:8686"

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  # Logs de tous les conteneurs Docker de l'hôte (Vector s'exclut lui-même)
  docker:
    type: docker_logs

  # Syslog des machines surveillées (rsyslog, syslog-ng, équipements réseau).
  # Sockets bruts : le parsing se fait en VRL pour respecter `timezone`
  # (la source `syslog` native ignore ce réglage pour le format RFC 3164).
  syslog_tcp:
    type: socket
    mode: tcp
    address: "0.0.0.0:9000"

  syslog_udp:
    type: socket
    mode: udp
    address: "0.0.0.0:9000"

# ---------------------------------------------------------------------------
# 1. Normalisation (champs inspirés d'Elastic Common Schema)
# ---------------------------------------------------------------------------
transforms:
  docker_normalize:
    type: remap
    inputs:
      - docker
    source: |
      ."@timestamp" = del(.timestamp) || now()
      .event.dataset = "docker"
      .event.module = "docker"
      .host.name = del(.host)
      .container.id = del(.container_id)
      .container.name = del(.container_name)
      .container.image = del(.image)
      .container.created_at = del(.container_created_at)
      .log.stream = del(.stream)

      # Ne garder que les labels Compose utiles (les autres sont du bruit
      # et exposent des chemins locaux)
      labels = object(del(.label)) ?? {}
      .container.compose.project = labels."com.docker.compose.project"
      .container.compose.service = labels."com.docker.compose.service"

      # Si le message est du JSON, on l'expose dans `json`
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        .json = parsed
      }

      # Niveau de log déduit du contenu
      msg = string(.message) ?? ""
      .log.level = if match(msg, r'(?i)\b(fatal|critical|crit)\b') {
        "critical"
      } else if match(msg, r'(?i)\b(error|err|exception)\b') {
        "error"
      } else if match(msg, r'(?i)\b(warn|warning)\b') {
        "warning"
      } else {
        "info"
      }

  syslog_normalize:
    type: remap
    inputs:
      - syslog_tcp
      - syslog_udp
    source: |
      peer = string(del(.host)) ?? ""
      if is_ipv4(peer) || is_ipv6(peer) {
        .host.ip = peer
      }
      del(.port)
      del(.timestamp)
      .event.dataset = "syslog"
      .event.module = "syslog"

      parsed, err = parse_syslog(.message)
      if err != null {
        # Ligne non conforme : conservée telle quelle pour ne rien perdre
        ."@timestamp" = now()
        .log.level = "info"
        .tags = ["_syslog_parse_failure"]
      } else {
        ."@timestamp" = parsed.timestamp || now()
        .message = parsed.message
        .host.name = parsed.hostname
        .process.name = parsed.appname
        pid = to_int(parsed.procid) ?? null
        if pid != null {
          .process.pid = pid
        }
        .log.level = parsed.severity || "info"
        .log.syslog.facility = parsed.facility
      }

  # -------------------------------------------------------------------------
  # 2. Journaux d'accès web (nginx / Apache, format « combined »),
  #    qu'ils arrivent par Docker ou par syslog → index soc-web-*
  # -------------------------------------------------------------------------
  web_parse:
    type: remap
    inputs:
      - docker_normalize
      - syslog_normalize
    source: |
      msg = string(.message) ?? ""
      web, err = parse_regex(msg, r'^(?P<client>\S+) \S+ (?P<user>\S+) \[[^\]]+\] "(?P<method>[A-Z]+) (?P<path>\S+)(?: (?P<proto>[^"]*))?" (?P<status>\d{3}) (?P<size>\d+|-)(?: "(?P<referer>[^"]*)" "(?P<agent>[^"]*)")?')
      if err == null {
        .event.origin = .event.dataset
        .event.dataset = "web"
        .event.category = "web"
        .source.address = web.client
        if web.user != "-" {
          .user.name = web.user
        }
        .http.request.method = web.method
        .http.request.referrer = web.referer
        .http.version = web.proto
        .http.response.status_code = to_int(web.status) ?? null
        .http.response.bytes = to_int(web.size) ?? null
        .url.original = web.path
        .user_agent.original = web.agent
        .event.outcome = if (to_int(web.status) ?? 0) >= 400 { "failure" } else { "success" }
      }

  # -------------------------------------------------------------------------
  # 3. Détection.
  #    Chaque règle choisit un identifiant ; le catalogue ci-dessous fournit
  #    nom, gravité, score de menace et technique MITRE ATT&CK.
  #    Ajouter une règle = une entrée au catalogue + une condition + un test.
  # -------------------------------------------------------------------------
  security_detect:
    type: remap
    inputs:
      - web_parse
    source: |
      catalog = {
        "ssh_auth_failure":   { "name": "SSH - échec d'authentification",      "severity": "low",    "score": 2,  "tactic": "Credential Access",    "technique_id": "T1110",     "technique": "Brute Force" },
        "ssh_invalid_user":   { "name": "SSH - utilisateur inexistant",         "severity": "low",    "score": 2,  "tactic": "Credential Access",    "technique_id": "T1110.001", "technique": "Password Guessing" },
        "ssh_root_login":     { "name": "SSH - connexion directe en root",      "severity": "medium", "score": 5,  "tactic": "Initial Access",       "technique_id": "T1078",     "technique": "Valid Accounts" },
        "sudo_denied":        { "name": "sudo refusé",                          "severity": "medium", "score": 5,  "tactic": "Privilege Escalation", "technique_id": "T1548.003", "technique": "Sudo and Sudo Caching" },
        "sudo_root":          { "name": "Élévation de privilèges vers root",    "severity": "medium", "score": 3,  "tactic": "Privilege Escalation", "technique_id": "T1548.003", "technique": "Sudo and Sudo Caching" },
        "user_created":       { "name": "Création de compte utilisateur",       "severity": "medium", "score": 8,  "tactic": "Persistence",          "technique_id": "T1136.001", "technique": "Create Account: Local Account" },
        "admin_group_added":  { "name": "Ajout à un groupe d'administration",   "severity": "high",   "score": 12, "tactic": "Persistence",          "technique_id": "T1098",     "technique": "Account Manipulation" },
        "web_sqli":           { "name": "Web - injection SQL",                  "severity": "high",   "score": 10, "tactic": "Initial Access",       "technique_id": "T1190",     "technique": "Exploit Public-Facing Application" },
        "web_cmd_injection":  { "name": "Web - injection de commande",          "severity": "high",   "score": 12, "tactic": "Initial Access",       "technique_id": "T1190",     "technique": "Exploit Public-Facing Application" },
        "web_traversal":      { "name": "Web - traversée de répertoire",        "severity": "high",   "score": 10, "tactic": "Initial Access",       "technique_id": "T1190",     "technique": "Exploit Public-Facing Application" },
        "web_xss":            { "name": "Web - XSS",                            "severity": "medium", "score": 6,  "tactic": "Initial Access",       "technique_id": "T1190",     "technique": "Exploit Public-Facing Application" },
        "web_sensitive_file": { "name": "Web - accès à une ressource sensible", "severity": "medium", "score": 5,  "tactic": "Reconnaissance",       "technique_id": "T1595.003", "technique": "Wordlist Scanning" },
        "web_scanner":        { "name": "Web - scanner de vulnérabilités",      "severity": "medium", "score": 5,  "tactic": "Reconnaissance",       "technique_id": "T1595.002", "technique": "Vulnerability Scanning" },
        "honeypot_contact":   { "name": "Pot de miel - contact",                "severity": "high",   "score": 10, "tactic": "Reconnaissance",       "technique_id": "T1595",     "technique": "Active Scanning" },
        "honeypot_login":     { "name": "Pot de miel - tentative de connexion", "severity": "high",   "score": 15, "tactic": "Credential Access",    "technique_id": "T1110",     "technique": "Brute Force" }
      }

      rule_id = null
      msg = string(.message) ?? ""
      dataset = string(.event.dataset) ?? ""

      # === Pot de miel : tout contact est suspect par construction =========
      if dataset == "docker" && .json.honeypot == true {
        dataset = "honeypot"
        .event.dataset = "honeypot"
        .event.category = "intrusion_detection"
        .event.action = string(.json.event) ?? "contact"
        .source.address = .json.src_ip
        .destination.port = to_int(.json.port) ?? null
        .network.protocol = .json.service
        .url.original = .json.path
        .http.request.method = .json.method
        .user_agent.original = .json.user_agent
        if is_string(.json.username) {
          .user.name = .json.username
          rule_id = "honeypot_login"
        } else {
          rule_id = "honeypot_contact"
        }
        .message = string(.json.summary) ?? msg
        del(.json)
      }

      # === Syslog ==========================================================
      if dataset == "syslog" {
        # --- SSH -----------------------------------------------------------
        ssh_fail, err = parse_regex(msg, r'Failed (?P<method>password|publickey) for (?:invalid user )?(?P<user>\S+) from (?P<ip>\S+)')
        if err == null {
          .event.category = "authentication"
          .event.action = "ssh_login"
          .event.outcome = "failure"
          .user.name = ssh_fail.user
          .source.address = ssh_fail.ip
          .auth.method = ssh_fail.method
          rule_id = "ssh_auth_failure"
        }

        ssh_ok, err = parse_regex(msg, r'Accepted (?P<method>password|publickey) for (?P<user>\S+) from (?P<ip>\S+)')
        if err == null {
          .event.category = "authentication"
          .event.action = "ssh_login"
          .event.outcome = "success"
          .user.name = ssh_ok.user
          .source.address = ssh_ok.ip
          .auth.method = ssh_ok.method
          if ssh_ok.user == "root" {
            rule_id = "ssh_root_login"
          }
        }

        invalid, err = parse_regex(msg, r'^Invalid user (?P<user>\S+) from (?P<ip>\S+)')
        if err == null {
          .event.category = "authentication"
          .event.action = "ssh_invalid_user"
          .event.outcome = "failure"
          .user.name = invalid.user
          .source.address = invalid.ip
          rule_id = "ssh_invalid_user"
        }

        # --- sudo ----------------------------------------------------------
        sudo, err = parse_regex(msg, r'^\s*(?P<user>\S+) : .*USER=(?P<target>\S+) ; COMMAND=(?P<cmd>.+)$')
        if err == null && .process.name == "sudo" {
          .event.category = "process"
          .event.action = "sudo"
          .user.name = sudo.user
          .user.target.name = sudo.target
          .process.command_line = sudo.cmd
          is_fail = match(msg, r'(?i)(incorrect password|NOT in sudoers|authentication failure|conversation failed|command not allowed)')
          if is_fail {
            .event.outcome = "failure"
            rule_id = "sudo_denied"
          } else {
            .event.outcome = "success"
            if sudo.target == "root" {
              rule_id = "sudo_root"
            }
          }
        }

        # --- Comptes -------------------------------------------------------
        newuser, err = parse_regex(msg, r'new user: name=(?P<user>[^,\s]+)')
        if err == null {
          .event.category = "iam"
          .event.action = "user_created"
          .event.outcome = "success"
          .user.target.name = newuser.user
          rule_id = "user_created"
        }

        grp, err = parse_regex(msg, r'add \x27(?P<user>[^\x27]+)\x27 to group \x27(?P<group>sudo|wheel|admin|root)\x27')
        if err == null {
          .event.category = "iam"
          .event.action = "group_membership_added"
          .event.outcome = "success"
          .user.target.name = grp.user
          .group.name = grp.group
          rule_id = "admin_group_added"
        }

        # --- Pare-feu (UFW) : événements réseau, corrélés par le moniteur
        #     « Scan de ports » côté OpenSearch ------------------------------
        fw, err = parse_regex(msg, r'\[UFW (?P<action>BLOCK|AUDIT|ALLOW)\].*?SRC=(?P<src>\S+) DST=(?P<dst>\S+).*?PROTO=(?P<proto>\S+)(?: SPT=(?P<spt>\d+) DPT=(?P<dpt>\d+))?')
        if err == null {
          .event.category = "network"
          .event.action = "firewall_" + downcase!(fw.action)
          .event.outcome = if fw.action == "BLOCK" { "failure" } else { "success" }
          .source.address = fw.src
          .destination.address = fw.dst
          .destination.port = to_int(fw.dpt) ?? null
          .source.port = to_int(fw.spt) ?? null
          .network.transport = downcase!(fw.proto)
        }
      }

      # === Web =============================================================
      if dataset == "web" {
        # Décodage de l'URL avant analyse (%27 → ', + → espace)
        raw = string(.url.original) ?? ""
        url = downcase(replace(decode_percent(raw), "+", " "))
        agent = downcase(string(.user_agent.original) ?? "")

        if match(url, r'(union\s+(all\s+)?select|select\s.+\sfrom\s|\x27\s*or\s*\x27?\d|\bor\s+1\s*=\s*1|sleep\(\d|benchmark\(|information_schema|;\s*drop\s+table)') {
          rule_id = "web_sqli"
        } else if match(url, r'(\$\{jndi:|;\s*(cat|ls|id|wget|curl|nc|bash|sh)\b|\|\s*(cat|id|sh|bash)\b|\$\((cat|id|whoami|curl|wget))') {
          rule_id = "web_cmd_injection"
        } else if match(url, r'(\.\./|\.\.\\|/etc/passwd|/etc/shadow|/proc/self/|c:\\windows)') {
          rule_id = "web_traversal"
        } else if match(url, r'(<script|javascript:|onerror\s*=|onload\s*=|<img\s|<svg\s)') {
          rule_id = "web_xss"
        } else if match(url, r'^/+(\.env|\.git/|\.aws/|\.ssh/|wp-login\.php|xmlrpc\.php|phpmyadmin|pma/|server-status|actuator/|config\.php|backup\.sql|\.htpasswd)') {
          rule_id = "web_sensitive_file"
        } else if match(agent, r'(sqlmap|nikto|nmap|masscan|nuclei|wpscan|dirbuster|gobuster|ffuf|acunetix|zgrab|hydra|openvas)') {
          rule_id = "web_scanner"
        }
        if rule_id != null {
          .event.action = if rule_id == "web_scanner" || rule_id == "web_sensitive_file" { "web_scan" } else { "web_attack" }
        }
      }

      # === Finalisation ====================================================
      # Les adresses valides vont dans source.ip / destination.ip (type IP,
      # utilisable pour les agrégations) ; sinon elles restent dans *.address.
      src = string(.source.address) ?? ""
      if is_ipv4(src) || is_ipv6(src) {
        .source.ip = src
      }
      dst = string(.destination.address) ?? ""
      if is_ipv4(dst) || is_ipv6(dst) {
        .destination.ip = dst
      }

      if is_string(rule_id) {
        id = string!(rule_id)
        meta = object!(get!(catalog, [id]))
        .rule.id = id
        .rule.name = meta.name
        .rule.severity = meta.severity
        .rule.score = meta.score
        .threat.framework = "MITRE ATT&CK"
        .threat.tactic.name = meta.tactic
        .threat.technique.id = meta.technique_id
        .threat.technique.name = meta.technique
        .event.kind = "alert"
      } else {
        .event.kind = "event"
      }

# ---------------------------------------------------------------------------
# Destination : un index par jour et par jeu de données
#   soc-docker-*, soc-syslog-*, soc-web-*, soc-honeypot-*
# Compte `vector` : écriture sur soc-* uniquement (créé par scripts/setup.sh)
# ---------------------------------------------------------------------------
sinks:
  opensearch:
    type: elasticsearch
    inputs:
      - security_detect
    endpoints:
      - "https://opensearch-node1:9200"
      - "https://opensearch-node2:9200"
    api_version: v8
    bulk:
      index: "soc-{{ event.dataset }}-%Y.%m.%d"
    auth:
      strategy: basic
      user: "vector"
      password: "${VECTOR_PASSWORD}"
    tls:
      verify_certificate: false
    buffer:
      type: disk
      max_size: 1048576000   # 1 Go : absorbe une indisponibilité d'OpenSearch
      when_full: block
