data_dir: "/var/lib/vector"

# Fuseau des horodatages sans fuseau (syslog RFC 3164 envoie l'heure locale)
timezone: "${SOC_TIMEZONE:-Europe/Paris}"

# API Vector : santé du pipeline (/health) et `vector top`
api:
  enabled: true
  address: "0.0.0.0:8686"

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  # Logs de tous les conteneurs Docker de l'hôte (Vector s'exclut lui-même)
  docker:
    type: docker_logs

  # Syslog des machines surveillées (rsyslog, syslog-ng, équipements réseau).
  # Sockets bruts : le parsing se fait en VRL pour respecter `timezone`
  # (la source `syslog` native ignore ce réglage pour le format RFC 3164).
  syslog_tcp:
    type: socket
    mode: tcp
    address: "0.0.0.0:9000"

  syslog_udp:
    type: socket
    mode: udp
    address: "0.0.0.0:9000"

# ---------------------------------------------------------------------------
# Normalisation (champs inspirés d'Elastic Common Schema)
# ---------------------------------------------------------------------------
transforms:
  docker_normalize:
    type: remap
    inputs:
      - docker
    source: |
      ."@timestamp" = del(.timestamp) || now()
      .event.dataset = "docker"
      .event.module = "docker"
      .host.name = del(.host)
      .container.id = del(.container_id)
      .container.name = del(.container_name)
      .container.image = del(.image)
      .container.created_at = del(.container_created_at)
      .log.stream = del(.stream)

      # Ne garder que les labels Compose utiles (les autres sont du bruit
      # et exposent des chemins locaux)
      labels = object(del(.label)) ?? {}
      .container.compose.project = labels."com.docker.compose.project"
      .container.compose.service = labels."com.docker.compose.service"

      # Si le message est du JSON, on l'expose dans `json`
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        .json = parsed
      }

      # Niveau de log déduit du contenu
      msg = string(.message) ?? ""
      .log.level = if match(msg, r'(?i)\b(fatal|critical|crit)\b') {
        "critical"
      } else if match(msg, r'(?i)\b(error|err|exception)\b') {
        "error"
      } else if match(msg, r'(?i)\b(warn|warning)\b') {
        "warning"
      } else {
        "info"
      }

  syslog_normalize:
    type: remap
    inputs:
      - syslog_tcp
      - syslog_udp
    source: |
      .host.ip = del(.host)
      del(.port)
      del(.timestamp)
      .event.dataset = "syslog"
      .event.module = "syslog"

      parsed, err = parse_syslog(.message)
      if err != null {
        # Ligne non conforme : conservée telle quelle pour ne rien perdre
        ."@timestamp" = now()
        .log.level = "info"
        .tags = ["_syslog_parse_failure"]
      } else {
        ."@timestamp" = parsed.timestamp || now()
        .message = parsed.message
        .host.name = parsed.hostname
        .process.name = parsed.appname
        .process.pid = parsed.procid
        .log.level = parsed.severity || "info"
        .log.syslog.facility = parsed.facility
      }

  # -------------------------------------------------------------------------
  # Détection : authentification SSH et élévation de privilèges
  # -------------------------------------------------------------------------
  security_detect:
    type: remap
    inputs:
      - syslog_normalize
    source: |
      msg = string(.message) ?? ""

      ssh_fail, err = parse_regex(msg, r'Failed (?P<method>password|publickey) for (?:invalid user )?(?P<user>\S+) from (?P<ip>[0-9a-fA-F.:]+)')
      if err == null {
        .event.category = "authentication"
        .event.action = "ssh_login"
        .event.outcome = "failure"
        .user.name = ssh_fail.user
        .source.ip = ssh_fail.ip
        .auth.method = ssh_fail.method
        .rule.name = "SSH - échec d'authentification"
      }

      ssh_ok, err = parse_regex(msg, r'Accepted (?P<method>password|publickey) for (?P<user>\S+) from (?P<ip>[0-9a-fA-F.:]+)')
      if err == null {
        .event.category = "authentication"
        .event.action = "ssh_login"
        .event.outcome = "success"
        .user.name = ssh_ok.user
        .source.ip = ssh_ok.ip
        .auth.method = ssh_ok.method
      }

      invalid, err = parse_regex(msg, r'Invalid user (?P<user>\S+) from (?P<ip>[0-9a-fA-F.:]+)')
      if err == null {
        .event.category = "authentication"
        .event.action = "ssh_invalid_user"
        .event.outcome = "failure"
        .user.name = invalid.user
        .source.ip = invalid.ip
        .rule.name = "SSH - utilisateur inexistant"
      }

      sudo, err = parse_regex(msg, r'^\s*(?P<user>\S+) : .*USER=(?P<target>\S+) ; COMMAND=(?P<cmd>.+)$')
      if err == null && .process.name == "sudo" {
        .event.category = "process"
        .event.action = "sudo"
        .event.outcome = if contains(msg, "incorrect password") { "failure" } else { "success" }
        .user.name = sudo.user
        .user.target.name = sudo.target
        .process.command_line = sudo.cmd
        if .user.target.name == "root" {
          .rule.name = "Élévation de privilèges vers root"
        }
      }

      .event.kind = if exists(.rule.name) { "alert" } else { "event" }

# ---------------------------------------------------------------------------
# Destinations : un index par jour et par type de source
# ---------------------------------------------------------------------------
sinks:
  opensearch_docker:
    type: elasticsearch
    inputs:
      - docker_normalize
    endpoints:
      - "https://opensearch-node1:9200"
    api_version: v8
    bulk:
      index: "soc-docker-%Y.%m.%d"
    auth:
      strategy: basic
      user: "admin"
      password: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    tls:
      verify_certificate: false

  opensearch_syslog:
    type: elasticsearch
    inputs:
      - security_detect
    endpoints:
      - "https://opensearch-node1:9200"
    api_version: v8
    bulk:
      index: "soc-syslog-%Y.%m.%d"
    auth:
      strategy: basic
      user: "admin"
      password: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    tls:
      verify_certificate: false
